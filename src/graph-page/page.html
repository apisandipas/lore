<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>/*TITLE*/</title>
<style>/*STYLE*/</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="controls" class="panel">
  <h1>lore graph <span id="repo"></span></h1>
  <input id="search" placeholder="Search notes…" autocomplete="off">
  <div class="group"><h2>Types</h2><div id="types"></div></div>
  <div class="group"><h2>Show</h2>
    <label class="row"><input type="checkbox" id="showCode"> Code (anchors, citations)</label>
    <label class="row"><input type="checkbox" id="showOld" checked> Superseded and retired</label>
    <label class="row"><input type="checkbox" id="showOrphans" checked> Notes with no links</label>
  </div>
  <div class="group"><h2>Edges</h2>
    <div class="legend">
      <svg width="30" height="8"><line x1="0" y1="4" x2="30" y2="4" stroke="var(--edge)" stroke-width="2"/></svg><span>link field (specs, …)</span>
      <svg width="30" height="8"><line x1="0" y1="4" x2="30" y2="4" stroke="var(--edge)" stroke-width="2" stroke-dasharray="6 4"/></svg><span>supersedes</span>
      <svg width="30" height="8"><line x1="0" y1="4" x2="30" y2="4" stroke="var(--edge)" stroke-width="1"/></svg><span>link in the body</span>
      <svg width="30" height="8"><line x1="0" y1="4" x2="30" y2="4" stroke="var(--code)" stroke-width="1.5" stroke-dasharray="2 3"/></svg><span>anchor or citation</span>
    </div>
  </div>
</div>

<div id="focusbar" class="panel"><span id="focusLabel"></span><button id="unfocus">Show all</button></div>
<div id="details" class="panel"><div id="grip" title="Drag to resize"></div><button id="close" aria-label="Close">×</button><div id="body"></div></div>
<div id="hint">Drag to pan · scroll to zoom · drag a note to move it · click for details</div>
<script type="application/json" id="data">/*DATA*/</script>
<script>/*SCRIPT*/</script>
</body>
</html>
